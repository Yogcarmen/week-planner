<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="周计划">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>周计划时间轴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: a paper planner — sticky time axis left, seven day columns Sat→Fri; solid blocks = what happened, dashed = booked ahead */
  --paper:#f4f6f9; --sheet:#ffffff; --ink:#1c2230; --muted:#687083; --rule:#eceef3; --rule-strong:#d7dbe3;
  --accent:#2c4aa8; --accent-soft:#e6ebf8; --now:#e0442f; --weekend:#f6f7fc;
  --study:#2a78d6; --study-bg:#e1ecfa; --study-ink:#134a8c;
  --phd:#eb6834;   --phd-bg:#fde7dd;   --phd-ink:#8a3110;
  --job:#1baf7a;   --job-bg:#dcf4ea;   --job-ink:#0c5c3f;
  --life:#eda100;  --life-bg:#fdf0cf;  --life-ink:#6e4a00;
  --relax:#e87ba4; --relax-bg:#fbe5ee; --relax-ink:#8a2550;
  --none:#6b7180;  --none-bg:#eceef2;  --none-ink:#3a3f4a;
  --shadow:0 6px 24px rgba(20,30,60,.14);
  --font-body:"Noto Sans SC",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hh:52px; --axis:48px; --colmin:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12151c; --sheet:#181c25; --ink:#e7eaf1; --muted:#9097a8; --rule:#232835; --rule-strong:#313849;
    --accent:#8ea8ff; --accent-soft:#232c48; --now:#ff6a55; --weekend:#1b2030;
    --study:#3987e5; --study-bg:#1c2a44; --study-ink:#d4e4fb;
    --phd:#d95926;   --phd-bg:#3a2219;   --phd-ink:#ffd9c7;
    --job:#199e70;   --job-bg:#15322a;   --job-ink:#c4f0de;
    --life:#c98500;  --life-bg:#352a12;  --life-ink:#fbe6b4;
    --relax:#d55181; --relax-bg:#3a1f2b; --relax-ink:#ffd3e4;
    --none:#9aa1b0;  --none-bg:#262b36;  --none-ink:#dde1e9;
    --shadow:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151c; --sheet:#181c25; --ink:#e7eaf1; --muted:#9097a8; --rule:#232835; --rule-strong:#313849;
  --accent:#8ea8ff; --accent-soft:#232c48; --now:#ff6a55; --weekend:#1b2030;
  --study:#3987e5; --study-bg:#1c2a44; --study-ink:#d4e4fb;
  --phd:#d95926;   --phd-bg:#3a2219;   --phd-ink:#ffd9c7;
  --job:#199e70;   --job-bg:#15322a;   --job-ink:#c4f0de;
  --life:#c98500;  --life-bg:#352a12;  --life-ink:#fbe6b4;
  --relax:#d55181; --relax-bg:#3a1f2b; --relax-ink:#ffd3e4;
  --none:#9aa1b0;  --none-bg:#262b36;  --none-ink:#dde1e9;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
.k-study{--cc:var(--study);--cbg:var(--study-bg);--cink:var(--study-ink)}
.k-phd{--cc:var(--phd);--cbg:var(--phd-bg);--cink:var(--phd-ink)}
.k-job{--cc:var(--job);--cbg:var(--job-bg);--cink:var(--job-ink)}
.k-life{--cc:var(--life);--cbg:var(--life-bg);--cink:var(--life-ink)}
.k-relax{--cc:var(--relax);--cbg:var(--relax-bg);--cink:var(--relax-ink)}
.k-none{--cc:var(--none);--cbg:var(--none-bg);--cink:var(--none-ink)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.app-android .top{padding-top:max(32px, calc(10px + env(safe-area-inset-top)))}
.top{display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));background:var(--sheet);border-bottom:1px solid var(--rule-strong)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-title{font-size:17px;font-weight:700;margin-right:4px;text-wrap:balance}
.week-title small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.spacer{flex:1}
.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:5px 10px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{padding:5px 9px;min-width:32px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--now);border-color:color-mix(in srgb,var(--now) 40%,transparent)}
.btn.wide{width:100%;padding:9px 12px}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.btn-group .btn:last-child{border-radius:0 8px 8px 0}
.sz{align-items:center}
.ico{display:inline-flex;align-items:center;justify-content:center;gap:3px}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico .badge{margin-left:2px}
.seg button .sw{margin-right:0}
.seg button{padding:5px 12px}
.seg .sw{width:18px;height:11px}
.sz .sz-l{font-size:12px;color:var(--muted);margin-right:5px}
.sz .btn:nth-child(2){border-radius:8px 0 0 8px;margin-left:0}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--none);display:inline-block}
.sync[data-s="ok"] i{background:var(--life)}
.sync[data-s="saving"] i{background:#e0a020}
.sync[data-s="err"] i,.sync[data-s="local"] i{background:var(--now)}

.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:999px;padding:2px;background:var(--paper);flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.15);font-weight:500}
.seg button .sw{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.sw.solid{background:var(--muted)}
.sw.dash{border:1.5px dashed var(--muted)}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;align-items:center;min-width:0;flex:1}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px 4px 9px;border:1px solid transparent;font-size:13px;line-height:1.4;user-select:none;background:var(--cbg);color:var(--cink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip small{opacity:.7;font-family:var(--font-mono);font-size:11px}
.chip.plan-mode{background:transparent;border:1.5px dashed var(--cc)}
.chip.armed{border:1.5px solid var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 22%,transparent)}
.chip.ghost{background:transparent;border:1px dashed var(--rule-strong);color:var(--muted)}
.summary{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.summary b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.summary .k{display:inline-flex;align-items:center;gap:5px}
.summary .k i{width:10px;height:3px;border-radius:2px;display:inline-block;background:var(--cc)}
.banner{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 10px}

/* pomodoro pill */
.pomo{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:3px 4px 3px 12px;background:var(--cbg);color:var(--cink);border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);position:relative;overflow:hidden;white-space:nowrap}
.pomo .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--cc) 18%,transparent);pointer-events:none}
.pomo > *:not(.fill){position:relative}
.pomo b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:14px}
.pomo .btn{padding:2px 9px;font-size:12px;border-radius:999px;background:var(--sheet)}
.pomo.brk{--cc:var(--life);--cbg:var(--life-bg);--cink:var(--life-ink)}

/* ---------- board ---------- */
.board{flex:1;min-height:0;overflow:auto;position:relative;background:var(--sheet);overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
.grid{display:grid;grid-template-columns:var(--axis) repeat(7,minmax(var(--colmin),1fr));min-width:calc(var(--axis) + 7*var(--colmin))}
.corner{position:sticky;top:0;left:0;z-index:6;background:var(--sheet);border-bottom:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong)}
.dayhead{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule-strong);border-left:1px solid var(--rule);padding:7px 6px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.dayhead.wk{background:var(--weekend)}
.dayhead .dn{display:flex;align-items:baseline;gap:2px 5px;white-space:nowrap;flex-wrap:wrap}
.dayhead .dn b{font-size:14px}
.dayhead .dn span{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.dayhead.today .dn b{color:var(--now)}
.dayhead.today .dn span{background:var(--now);color:#fff;border-radius:4px;padding:0 4px}
.bar{display:flex;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc)}
.focus{font-size:11px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.axis{position:sticky;left:0;z-index:4;background:var(--sheet);border-right:1px solid var(--rule-strong)}
.axis .hl{position:absolute;right:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.axis .hl.mid{color:var(--accent);font-weight:500}
.axis .nowtag{position:absolute;right:2px;transform:translateY(-50%);background:var(--now);color:#fff;font-family:var(--font-mono);font-size:10.5px;padding:1px 4px;border-radius:4px;z-index:2;font-variant-numeric:tabular-nums}
.daycol{position:relative;border-left:1px solid var(--rule);cursor:copy;
  background-image:repeating-linear-gradient(to bottom,var(--rule-strong) 0 1px,transparent 1px calc(var(--hh)/2),var(--rule) calc(var(--hh)/2),var(--rule) calc(var(--hh)/2 + 1px),transparent calc(var(--hh)/2 + 1px) var(--hh))}
.daycol.wk{background-color:var(--weekend)}
.daycol.today{background-color:color-mix(in srgb,var(--now) 4%,transparent)}
.midline{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);pointer-events:none}
.past{position:absolute;left:0;right:0;top:0;background:color-mix(in srgb,var(--ink) 2.5%,transparent);pointer-events:none}
.nowline{position:absolute;left:-1px;right:0;height:0;border-top:2px solid var(--now);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.pomoband{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--cc) 30%,transparent) 0 4px,transparent 4px 8px);border-left:3px solid var(--cc);pointer-events:none;z-index:3;opacity:.8}

.ev{position:absolute;border-radius:6px;padding:3px 5px 3px 7px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:var(--cbg);color:var(--cink);border-left:3px solid var(--cc);font-size:12px;line-height:1.3;z-index:2;transition:box-shadow .12s}
.ev:hover{box-shadow:0 2px 8px rgba(20,30,60,.15)}
.ev.plan:not(.done){background:color-mix(in srgb,var(--cbg) 40%,var(--sheet));border:1.5px dashed var(--cc);padding-left:6px}
.ev.plan{padding-right:20px}
.ev .t{font-weight:500;overflow-wrap:anywhere}
.ev .m{font-family:var(--font-mono);font-size:10.5px;opacity:.8;font-variant-numeric:tabular-nums}
.ev.short{display:flex;gap:5px;align-items:center;white-space:nowrap}
.ev.short .t{overflow:hidden;text-overflow:ellipsis}
.ev .ck{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--cc);background:var(--sheet);padding:0;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff;cursor:pointer}
.ev.done .ck{background:var(--cc)}
.ev.short .ck{top:50%;transform:translateY(-50%)}
.ev .h{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;touch-action:none}
.ev .h::after{content:"";position:absolute;left:50%;bottom:2px;width:16px;margin-left:-8px;height:2px;border-radius:1px;background:currentColor;opacity:0}
.ev:hover .h::after{opacity:.35}
@media (pointer:coarse){.ev .h{height:14px}.ev .h::after{opacity:.3}.ev .ck{width:18px;height:18px}}
.ev.dragging{box-shadow:var(--shadow);z-index:10;cursor:grabbing;opacity:.95}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
@media (min-width:600px){.overlay{align-items:center;padding:24px}}
.modal{background:var(--sheet);width:100%;max-width:460px;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:18px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
@media (min-width:600px){.modal{border-radius:14px}}
.modal h2{margin:0;font-size:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=password],.field select,.field textarea,.field input[type=number]{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:54px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats label{display:inline-flex}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats .chip{border:1.5px solid transparent}
.cats input:checked + .chip{border-color:var(--cc);font-weight:500}
.cats input:focus-visible + .chip{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.preset-row{display:grid;grid-template-columns:1fr 66px 100px 30px;gap:6px;align-items:center}
.preset-row input,.preset-row select{border:1px solid var(--rule-strong);background:var(--paper);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
.err{font-size:13px;color:var(--now);min-height:1em;margin:0}
hr.sep{border:0;border-top:1px solid var(--rule);margin:2px 0;width:100%}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}

/* ---------- to-do: day-header rows + drawer ---------- */
.tdl{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.td{display:flex;align-items:center;gap:5px;border:0;background:transparent;padding:1px 0;font-size:11.5px;text-align:left;color:var(--ink);min-width:0;width:100%}
.td .bx{flex:none;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--cc);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;line-height:1}
.td.done .bx{background:var(--cc)}
.td .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td.done .tx{text-decoration:line-through;color:var(--muted)}
.td.more{color:var(--accent);font-size:11px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;font-family:var(--font-mono)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--sheet);box-shadow:var(--shadow);z-index:45;transform:translateX(105%);transition:transform .18s ease;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));gap:12px}
.drawer.open{transform:none}
.drawer h2{margin:0;font-size:16px}
.td-add{display:grid;grid-template-columns:1fr auto;gap:6px}
.td-add input,.td-add select{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.td-add .opts{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.td-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;margin:0 -4px;padding:0 4px}
.td-sec h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.td-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--rule)}
.td-row .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--cc);background:var(--sheet);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;padding:0}
.td-row.done .bx{background:var(--cc)}
.td-row .tt{border:0;background:transparent;text-align:left;padding:0;min-width:0;overflow-wrap:anywhere}
.td-row.done .tt{text-decoration:line-through;color:var(--muted)}
.td-row .dt{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.td-row .dt.late{color:var(--now)}
/* ---------- time summary ---------- */
.modal.stat{max-width:720px}
.stat-label{font-variant-numeric:tabular-nums;min-width:150px;text-align:center}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero b{font-size:30px;font-family:var(--font-mono);font-weight:500;letter-spacing:-.02em}
.hero span{color:var(--muted);font-size:12.5px}
.catbars{display:flex;flex-direction:column;gap:7px}
.cb{display:grid;grid-template-columns:76px 1fr 104px;align-items:center;gap:10px;font-size:13px}
.cb .nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cb .nm i{width:8px;height:8px;border-radius:2px;background:var(--cc)}
.cb .track{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.cb .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--cc);min-width:2px}
.cb .v{font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.cb .v small{color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--cc)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:end;height:170px;padding:0 2px;border-bottom:1px solid var(--rule-strong);position:relative}
.cols .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--rule);pointer-events:none}
.cols .gl span{position:absolute;right:0;top:-15px;font-size:10.5px;color:var(--muted);font-family:var(--font-mono);background:var(--sheet);padding-left:3px}
.col{display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;cursor:default;position:relative;z-index:1}
.col i{display:block;background:var(--cc);width:100%;max-width:42px;margin:0 auto}
.col i:last-child{border-radius:4px 4px 0 0}
.col:hover i{filter:brightness(1.08)}
.colx{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;font-size:11px;color:var(--muted);text-align:center;font-family:var(--font-mono)}
.colx b{display:block;color:var(--ink);font-weight:500}
.brk{width:100%;border-collapse:collapse;font-size:13px}
.brk th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 0 4px;border-bottom:1px solid var(--rule-strong)}
.brk td{padding:5px 0;border-bottom:1px solid var(--rule)}
.brk td.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.brk .ct{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.brk .ct i{width:8px;height:8px;border-radius:2px;background:var(--cc)}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--sheet);font-size:12px;line-height:1.5;padding:7px 10px;border-radius:7px;pointer-events:none;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;max-width:220px}
#statBody{display:flex;flex-direction:column;gap:10px}
.stat h3{margin:14px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.stat .legend{margin-bottom:12px}
@media (max-width:520px){ .cb{grid-template-columns:68px 1fr 92px} .cols,.colx{gap:5px} }
@media (max-width:520px){
  .drawer{top:auto;height:82%;width:100%;border-radius:16px 16px 0 0;transform:translateY(105%)}
  .drawer.open{transform:none}
}
@media (max-width:520px){
  :root{--axis:42px;--colmin:58px}
  .week-title{font-size:15px}
  .hide-sm{display:none}
  .ev.short .m{display:none}
  .ev{padding:2px 3px 2px 5px;font-size:11.5px}
  .top{gap:6px}
  .top .row{gap:6px}
  #syncText{display:none}
  .btn{padding:4px 8px}
  .btn.icon{min-width:30px;padding:4px 7px}
  .summary{gap:4px 10px;font-size:11.5px}
  .focus{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="week-title" id="weekTitle">本周</div>
    <div class="btn-group" role="group" aria-label="切换周">

    <button class="btn icon ico" id="undoBtn" title="撤销（Ctrl+Z）" aria-label="撤销" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn icon ico" id="copyPrev" title="复制上周到这一周" aria-label="复制上周到这一周"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>

  </div>
  <div class="row" style="flex-wrap:nowrap">
    <div class="seg" role="group" aria-label="新增方式">

      <button type="button" id="modePlan" aria-pressed="false" title="提前安排（虚线）" aria-label="提前安排"><span class="sw dash"></span></button>
    </div>
    <div class="presets" id="presets" aria-label="预设项目"></div>
  </div>
  <div class="row">
    <div class="summary" id="summary"></div>
    <span class="banner" id="banner" hidden></span>
    <div class="spacer"></div>
    <button class="btn icon ico" id="statBtn" type="button" title="时间统计" aria-label="时间统计"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><rect x="5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="5" width="3" height="13" rx="1"/><rect x="16" y="14" width="3" height="4" rx="1"/></svg></button>
    <button class="btn icon ico" id="todoBtn" type="button" title="待办" aria-label="待办"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span class="badge" id="todoCount" hidden></span></button>
    <div id="pomoBox"></div>

</header>

<!-- to-do drawer -->
<aside class="drawer" id="todoDrawer" aria-label="待办清单">

<!-- time summary -->

  <div class="modal stat" role="dialog" aria-modal="true" aria-labelledby="statTitle">

<div class="tip" id="tip" role="tooltip" hidden></div>

<!-- to-do editor -->

    <h2>编辑待办</h2>
    <div class="field"><label for="teTitle">内容</label><input type="text" id="teTitle" maxlength="80"></div>
    <div class="two">
      <div class="field"><label for="teDate">哪天做</label><input type="date" id="teDate"></div>

<main class="board" id="board"><div class="grid" id="grid"></div></main>

<!-- event editor -->
<div class="overlay" id="evOverlay">
  <form class="modal" id="evForm" autocomplete="off">
    <div class="row"><h2 id="evHeading">新建</h2><div class="spacer"></div>
      <div class="seg" role="radiogroup" aria-label="类型">
        <button type="button" data-type="record" aria-pressed="true"><span class="sw solid"></span>直接记录</button>
        <button type="button" data-type="plan" aria-pressed="false"><span class="sw dash"></span>提前安排</button>

<!-- pomodoro setup -->

<!-- sign in -->

<script type="module">
import { firebaseConfig } from "./firebase-config.js";

const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const CATS = {study:"备考", phd:"PhD申请", job:"找工作", life:"生活琐事", relax:"放松"};
const CAT_ORDER = ["study","phd","job","life","relax"];
const catName = c => CATS[c] || "未定";
const kcls = c => "k-" + (CATS[c] ? c : "none");
const DEFAULT_PRESETS = [
  {title:"单词",len:60,cat:"study"},{title:"数学",len:60,cat:"study"},{title:"填空",len:60,cat:"study"},
  {title:"阅读",len:60,cat:"study"},{title:"作文",len:120,cat:"study"},
  {title:"套磁邮件",len:60,cat:"phd"},{title:"申请材料",len:90,cat:"phd"},
  {title:"投简历",len:60,cat:"job"},{title:"网测 / 面试",len:60,cat:"job"},
  {title:"兼职",len:240,cat:"life"},{title:"吃饭",len:60,cat:"life"},{title:"家务采购",len:45,cat:"life"},
  {title:"自由时间",len:90,cat:"relax"},{title:"运动",len:60,cat:"relax"}
];
const DOW = ["周日","周一","周二","周三","周四","周五","周六"];
const ZOOMS = [36,44,52,64,80];

let settings = {start:7, end:27, presets: DEFAULT_PRESETS.map(p=>({...p}))};
let weekStart = null, events = [], hh = 52, armed = null, editing = null;
let mode = "record";

// ---------- utils ----------
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const satOf = d => addDays(d, -((d.getDay() - 6 + 7) % 7));
const fmt = m => pad(Math.floor(m/60)%24)+":"+pad(m%60);
const fmtLen = m => { const h=Math.floor(m/60), r=m%60; return h ? (r ? h+"h"+r : h+"h") : r+"m"; };
const hours = m => (Math.round(m/6)/10).toString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const weekKey = d => "w" + ymd(d);
const dayDiff = (a,b) => Math.round((a - b) / 864e5);
const counts = e => !e.plan || e.done;
function toLogical(dt){
  let day = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  let m = dt.getHours()*60 + dt.getMinutes();
  if (m < settings.start*60 && m + 1440 < settings.end*60) { day = addDays(day,-1); m += 1440; }
  return {day, m};
}
const logicalNow = () => toLogical(new Date());
function sanitizeEvents(list){
  if (!Array.isArray(list)) return [];
  return list.filter(e => e && typeof e === "object").map(e => ({
    id: String(e.id || uid()).slice(0,40),
    d: clamp(parseInt(e.d,10)||0, 0, 6),
    s: clamp(parseInt(e.s,10)||0, 0, 2880),
    len: clamp(parseInt(e.len,10)||60, 5, 1440),
    title: String(e.title||"").slice(0,60),
    cat: CATS[e.cat] ? e.cat : "",
    plan: !!e.plan, done: !!e.done,
    note: String(e.note||"").slice(0,500)
  }));
}
function sanitizeSettings(o){
  const s = {start:7, end:27, presets: DEFAULT_PRESETS.map(p=>({...p}))};
  if (!o || typeof o !== "object") return s;
  const st = parseInt(o.start,10), en = parseInt(o.end,10);
  if (st>=0 && st<=12) s.start = st;
  if (en>=18 && en<=30 && en >= s.start+8) s.end = en;
  if (Array.isArray(o.presets)) s.presets = o.presets.filter(p=>p && p.title).slice(0,40).map(p=>({
    title:String(p.title).slice(0,30), len:clamp(parseInt(p.len,10)||60,5,720), cat: CATS[p.cat]?p.cat:""
  }));
  return s;
}
let toastT=null;
function toast(msg, ms){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), ms||2600); }
const setSync = (state, text) => { $("sync").dataset.s = state; $("syncText").textContent = text; };
function lsGet(k){ try{ const v = localStorage.getItem("wkplan:"+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem("wkplan:"+k, JSON.stringify(v)); return true; }catch(e){ return false; } }

// ---------- storage: Firebase when configured, otherwise this browser ----------
const store = {mode:"local", fs:null, auth:null, A:null, F:null, user:null, unsubWeek:null, unsubSet:null, loadT:null};

function wRef(key){ return store.F.doc(store.fs, "users", store.user.uid, "weeks", key); }
function sRef(){ return store.F.doc(store.fs, "users", store.user.uid, "meta", "settings"); }
function tRef(){ return store.F.doc(store.fs, "users", store.user.uid, "meta", "todos"); }

async function initStore(){
  if (!firebaseConfig || !firebaseConfig.apiKey) {
    store.mode = "local";
    const s = lsGet("settings"); if (s) settings = sanitizeSettings(s);
    todos = sanitizeTodos((lsGet("todos")||{}).items); committedTodos = copyList(todos); renderTodos();
    setSync("local", "仅存本机");
    loadWeek();
    return;
  }
  try{
    const [appM, authM, fsM] = await Promise.all([
      import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
    ]);
    const app = appM.initializeApp(firebaseConfig);
    store.A = authM; store.F = fsM;
    store.auth = authM.getAuth(app);
    try{
      store.fs = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})});
    }catch(e){ store.fs = fsM.getFirestore(app); }
    authM.onAuthStateChanged(store.auth, user => {
      store.user = user;
      if (user) {
        store.mode = "cloud";
        $("loginOverlay").classList.remove("show");
        if (store.unsubSet) store.unsubSet();
        store.unsubSet = fsM.onSnapshot(sRef(), snap => {
          if (snap.exists()) { settings = sanitizeSettings(snap.data()); renderAll(); }
        }, () => {});
        if (store.unsubTodo) store.unsubTodo();
        store.unsubTodo = fsM.onSnapshot(tRef(), snap => {
          if (todoT) return;
          todos = snap.exists() ? sanitizeTodos((snap.data()||{}).items) : [];
          committedTodos = copyList(todos);
          renderAll(); renderTodos();
        }, () => {});
        loadWeek();
        if (!lsGet("migrated:"+user.uid) && localWeekKeys().length) offerMigrate();
      } else {
        store.mode = "signedout";
        if (store.unsubWeek) { store.unsubWeek(); store.unsubWeek = null; }
        if (store.unsubSet) { store.unsubSet(); store.unsubSet = null; }
        if (store.unsubTodo) { store.unsubTodo(); store.unsubTodo = null; }
        events = []; todos = []; renderAll(); renderTodos();
        setSync("err","未登录");
        $("loginOverlay").classList.add("show");
      }
    });
  }catch(e){
    console.error(e);
    store.mode = "local";
    setSync("err","同步服务加载失败，暂存本机");
    const s = lsGet("settings"); if (s) settings = sanitizeSettings(s);
    loadWeek();
  }
}

function loadWeek(){
  if (store.unsubWeek) { store.unsubWeek(); store.unsubWeek = null; }
  clearTimeout(store.loadT);
  events = [];
  const key = weekKey(weekStart);
  if (store.mode === "cloud") {
    setSync("saving","同步中…");
    store.loadT = setTimeout(()=> setSync("err","连不上服务器，显示的是本机缓存"), 10000);
    store.unsubWeek = store.F.onSnapshot(wRef(key), {includeMetadataChanges:true}, snap => {
      if (key !== weekKey(weekStart)) return;
      if (!snap.metadata.fromCache) { clearTimeout(store.loadT); setSync(snap.metadata.hasPendingWrites ? "saving" : "ok", snap.metadata.hasPendingWrites ? "保存中…" : "已同步"); }
      else if (snap.metadata.hasPendingWrites) setSync("saving","离线，联网后同步");
      if (pendingT) return;               // a local edit is about to be written; don't clobber it
      events = snap.exists() ? sanitizeEvents((snap.data()||{}).events) : [];
      committed = copyList(events);
      renderAll();
      if (afterLoad && !snap.metadata.fromCache) { const f = afterLoad; afterLoad = null; f(); }
    }, err => {
      clearTimeout(store.loadT);
      setSync("err", err && err.code === "permission-denied" ? "没有权限，检查 Firestore 规则" : "同步中断，刷新页面重试");
    });
  } else if (store.mode === "local") {
    const v = lsGet(key); events = sanitizeEvents(v && v.events);
  }
  committed = copyList(events);
  renderAll();
  if (afterLoad && store.mode === "local") { const f = afterLoad; afterLoad = null; f(); }
}
let afterLoad = null;   // runs once the newly shown week has loaded from the server

async function writeWeek(key, list){
  const data = {events: list.map(e=>({...e})), updatedAt: Date.now()};
  if (store.mode === "cloud") {
    store.F.setDoc(wRef(key), data).catch(err => {
      setSync("err", err && err.code === "permission-denied" ? "没有权限，检查 Firestore 规则" : "有改动未保存");
      toast("没保存上，检查网络后刷新再试");
    });
  } else if (store.mode === "local") {
    if (!lsSet(key, data)) toast("浏览器存储已满或不可用，这次改动没保存");
  }
}
async function readWeek(key){
  if (store.mode === "cloud") {
    try{ const s = await store.F.getDoc(wRef(key)); return s.exists() ? sanitizeEvents((s.data()||{}).events) : []; }
    catch(e){ return null; }
  }
  const v = lsGet(key); return sanitizeEvents(v && v.events);
}
function saveSettings(){
  if (store.mode === "cloud") store.F.setDoc(sRef(), {...settings, updatedAt: Date.now()}).catch(()=>toast("设置没保存上，稍后再试"));
  else lsSet("settings", settings);
}

let pendingT = null;
// undo: every change pushes the state from just before it (events of one week, or the to-do list)
let committed = [], committedTodos = [], undoStack = [];
const copyList = l => l.map(x=>({...x}));
function pushUndo(u){ undoStack.push(u); if (undoStack.length > 60) undoStack.shift(); $("undoBtn").disabled = false; }
function changed(opts){
  const key = weekKey(weekStart), snapshot = events.map(e=>({...e}));
  if (!(opts && opts.noUndo)) pushUndo({type:"week", key, before: committed});
  committed = copyList(events);
  clearTimeout(pendingT);
  pendingT = setTimeout(()=>{ pendingT = null; writeWeek(key, snapshot); }, 400);
  pendingFlush = () => { clearTimeout(pendingT); pendingT = null; writeWeek(key, snapshot); };
  renderAll();
}
let pendingFlush = null;
function flushNow(){ if (pendingT && pendingFlush) pendingFlush(); }
window.addEventListener("pagehide", flushNow);
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) flushNow(); });

// local → cloud migration (data entered before sign-in)
function localWeekKeys(){
  const out = [];
  try{ for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (/^wkplan:w\d{4}-\d{2}-\d{2}$/.test(k)) out.push(k.slice(7)); } }catch(e){}
  return out;
}
async function offerMigrate(){
  const keys = localWeekKeys();
  const n = keys.reduce((a,k)=>a + sanitizeEvents((lsGet(k)||{}).events).length, 0);
  if (!n) { lsSet("migrated:"+store.user.uid, true); return; }
  if (!(await ask(`这台设备上有登录前记下的 ${n} 项，要上传到账号里吗？已经在账号里的不会被覆盖。`, "上传"))) { lsSet("migrated:"+store.user.uid, true); return; }
  for (const k of keys){
    const local = sanitizeEvents((lsGet(k)||{}).events); if (!local.length) continue;
    const cloud = await readWeek(k); if (cloud === null) { toast("上传中断，检查网络后在设置里重试"); return; }
    const ids = new Set(cloud.map(e=>e.id));
    const merged = cloud.concat(local.filter(e=>!ids.has(e.id)));
    if (k === weekKey(weekStart)) { events = merged; changed(); } else writeWeek(k, merged);
  }
  lsSet("migrated:"+store.user.uid, true);
  toast("已上传");
}

// ---------- render ----------
const minToY = m => (m - settings.start*60) / 60 * hh;
function totals(list){
  const byDay = Array.from({length:7}, ()=>({})), wk = {};
  let pend = 0;
  for (const e of list){
    if (!counts(e)) { pend++; continue; }
    const c = e.cat || "none";
    byDay[e.d][c] = (byDay[e.d][c]||0) + e.len; wk[c] = (wk[c]||0) + e.len;
  }
  return {byDay, wk, pend};
}
function layoutDay(list){
  list.sort((a,b)=> a.s-b.s || b.len-a.len);
  let cluster=[], end=-1;
  const finish = () => {
    const cols=[];
    for (const e of cluster){ let i = cols.findIndex(x => x <= e.s); if (i<0){ i=cols.length; cols.push(0); } cols[i] = e.s+e.len; e._c = i; }
    for (const e of cluster) e._n = cols.length;
  };
  for (const e of list){
    if (cluster.length && e.s >= end){ finish(); cluster=[]; end=-1; }
    cluster.push(e); end = Math.max(end, e.s+e.len);
  }
  if (cluster.length) finish();
}
const ORDER_ALL = [...CAT_ORDER, "none"];

function renderBoard(){
  const grid = $("grid");
  const S = settings.start*60, E = settings.end*60, H = (E - S)/60 * hh;
  document.documentElement.style.setProperty("--hh", hh+"px");
  const ln = logicalNow();
  const todayIdx = dayDiff(ln.day, weekStart);
  const tt = totals(events).byDay;
  let html = `<div class="corner"></div>`;
  for (let i=0;i<7;i++){
    const d = addDays(weekStart, i);
    const segs = ORDER_ALL.map(c => tt[i][c] ? `<i class="${kcls(c)}" style="width:${tt[i][c]/(E-S)*100}%"></i>` : "").join("");
    const total = ORDER_ALL.reduce((a,c)=>a+(tt[i][c]||0),0);
    html += `<div class="dayhead${i<2?" wk":""}${i===todayIdx?" today":""}">
      <div class="dn"><b>${DOW[d.getDay()]}</b><span>${d.getMonth()+1}/${d.getDate()}</span></div>
      <div class="bar">${segs}</div>
      <div class="focus">${total ? "备考 "+hours(tt[i].study||0)+"h · 共 "+hours(total)+"h" : "&nbsp;"}</div>
      ${dayTodosHtml(ymd(d))}
    </div>`;
  }
  html += `<div class="axis" style="height:${H}px">`;
  for (let m = S + 60; m <= E; m += 60) html += `<div class="hl${m%1440===0?" mid":""}" style="top:${minToY(m)}px">${m%1440===0 ? "0:00" : fmt(m)}</div>`;
  if (todayIdx>=0 && todayIdx<7 && ln.m>=S && ln.m<=E) html += `<div class="nowtag" style="top:${minToY(ln.m)}px">${fmt(ln.m)}</div>`;
  html += `</div>`;
  const byDay = Array.from({length:7}, ()=>[]);
  for (const e of events) byDay[e.d].push(e);
  // live pomodoro band
  let band = null;
  if (pomo && pomo.phase === "focus") {
    const st = toLogical(new Date(pomo.startedAt));
    const di = dayDiff(st.day, weekStart);
    const nowM = Math.min(ln.m + (dayDiff(ln.day, st.day))*1440, st.m + pomo.focus);
    if (di>=0 && di<7) band = {d:di, s:st.m, e:Math.max(nowM, st.m+1), cat:pomo.cat};
  }
  for (let i=0;i<7;i++){
    layoutDay(byDay[i]);
    let inner = "";
    if (E > 1440 && S < 1440) inner += `<div class="midline" style="top:${minToY(1440)}px"></div>`;
    if (i < todayIdx) inner += `<div class="past" style="height:${H}px"></div>`;
    if (i === todayIdx && ln.m > S) inner += `<div class="past" style="height:${clamp(minToY(ln.m),0,H)}px"></div>`;
    for (const e of byDay[i]){
      const top = minToY(e.s), h = Math.max(e.len/60*hh - 2, 14), w = 100/e._n, short = h < 34;
      inner += `<div class="ev ${kcls(e.cat)}${e.plan?" plan":""}${e.done?" done":""}${short?" short":""}" data-id="${e.id}" role="button" tabindex="0"
        aria-label="${e.plan?(e.done?"已完成的提前安排 ":"提前安排 "):""}${esc(e.title||catName(e.cat))} ${fmt(e.s)} 到 ${fmt(e.s+e.len)}"
        style="top:${top+1}px;height:${h}px;left:calc(${w*e._c}% + 2px);width:calc(${w}% - 4px)">
        <div class="t">${esc(e.title || catName(e.cat))}</div><div class="m">${fmt(e.s)}${short?"":"–"+fmt(e.s+e.len)}</div>
        ${e.plan ? `<button type="button" class="ck" aria-label="${e.done?"标记为未完成":"标记为完成"}">${e.done?"✓":""}</button>` : ""}
        <div class="h" aria-hidden="true"></div></div>`;
    }
    if (band && band.d === i) inner += `<div class="pomoband ${kcls(band.cat)}" style="top:${minToY(band.s)}px;height:${(band.e-band.s)/60*hh}px"></div>`;
    if (i === todayIdx && ln.m>=S && ln.m<=E) inner += `<div class="nowline" style="top:${minToY(ln.m)}px"></div>`;
    html += `<div class="daycol${i<2?" wk":""}${i===todayIdx?" today":""}" data-d="${i}" style="height:${H}px">${inner}</div>`;
  }
  grid.innerHTML = html;
}

function chime(times){
  if (!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    for (let i=0;i<times;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = i%2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t0+i*0.35); g.gain.exponentialRampToValueAtTime(0.25, t0+i*0.35+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.35+0.3);
      o.connect(g).connect(audioCtx.destination); o.start(t0+i*0.35); o.stop(t0+i*0.35+0.32);
    }
  }catch(e){}
}
async function notify(title, body){
  chime(3);
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  toast(title + "：" + body, 6000);
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) reg.showNotification(title, {body, icon:"icon-192.png", tag:"wkplan-pomo", renotify:true});
    else new Notification(title, {body, icon:"icon-192.png"});
  }catch(e){}
}
function logFocus(startMs, endMs){
  if (!pomo.log) return;
  const st = toLogical(new Date(startMs));
  const len = Math.round((endMs - startMs)/60000);
  if (len < 5) return;

  const S=settings.start*60, E=settings.end*60;

function pomoTick(){

    logFocus(pomo.startedAt, pomo.endsAt);
    const late = now - pomo.endsAt > 60000;
    pomo.phase = "break"; pomo.startedAt = pomo.endsAt; pomo.endsAt = pomo.startedAt + pomo.brk*60000;
    if (now < pomo.endsAt) notify("专注结束", `${pomo.title || catName(pomo.cat)} ${pomo.focus} 分钟完成${late?"（已补记）":""}，休息 ${pomo.brk} 分钟`);
    savePomo();
  }
  if (pomo.phase === "break" && now >= pomo.endsAt){
    pomo.phase = "ready"; savePomo();
    notify("休息结束", "可以开始下一轮了");
  }
  renderPomo();
}

  if (!pomo) return;

    const mins = Math.round((Date.now() - pomo.startedAt)/60000);

      ask(`这一轮已经专注了 ${mins} 分钟，要记到时间轴上吗？`, "记上").then(yes=>{ if (yes) logFocus(pomo.startedAt, Date.now()); pomo = null; savePomo(); renderAll(); });

}

function activate(e){
  if (!drag) return;

    if (m) m.textContent = fmt(drag.s0) + "–" + fmt(drag.s0+drag.len);

function endDrag(e, cancelled){

  if (dated.length) h += `<section class="td-sec"><h3>定了日期</h3>${dated.map(row).join("")}</section>`;
  if (undated.length) h += `<section class="td-sec"><h3>没定哪天</h3>${undated.map(row).join("")}</section>`;
  if (done.length) h += `<section class="td-sec"><h3>已完成 ${done.length}<button type="button" class="btn" id="tdToggleDone" style="padding:1px 8px;font-size:12px">${showDone?"收起":"展开"}</button>${showDone?`<button type="button" class="btn" id="tdClearDone" style="padding:1px 8px;font-size:12px">清空</button>`:""}</h3>${showDone?done.map(row).join(""):""}</section>`;
  $("todoList").innerHTML = h;
}
function openTodos(){
  todoDateOptions($("tdDate"), $("tdDate").value || "");
  catOptions($("tdCat"), $("tdCat").value || "");
  $("todoDrawer").classList.add("open"); renderTodos();
  if (matchMedia("(pointer:fine)").matches) setTimeout(()=>$("tdTitle").focus(), 50);
}
const closeTodos = () => $("todoDrawer").classList.remove("open");
function toggleTodo(id){ const t = todos.find(x=>x.id===id); if (!t) return; t.done = !t.done; t.at = Date.now(); todosChanged(); }
$("todoBtn").onclick = ()=> $("todoDrawer").classList.contains("open") ? closeTodos() : openTodos();
$("todoClose").onclick = closeTodos;
$("todoAdd").addEventListener("submit", e=>{
  e.preventDefault();
  const title = $("tdTitle").value.trim(); if (!title) return;
  if (store.mode === "signedout") { $("loginOverlay").classList.add("show"); return; }
  todos.push({id:uid(), title, cat:$("tdCat").value, date:$("tdDate").value, done:false, note:"", at:Date.now()});
  $("tdTitle").value = ""; todosChanged();
});
$("todoList").addEventListener("click", e=>{
  const ck = e.target.closest("[data-tck]"); if (ck) { toggleTodo(ck.dataset.tck); return; }
  const ed = e.target.closest("[data-tedit]"); if (ed) { openTodoEditor(ed.dataset.tedit); return; }
  if (e.target.id === "tdToggleDone") { showDone = !showDone; renderTodos(); return; }
  if (e.target.id === "tdClearDone") { ask(`清空 ${todos.filter(t=>t.done).length} 条已完成的待办？`, "清空").then(y=>{ if (y) { todos = todos.filter(t=>!t.done); todosChanged(); } }); }
});
grid.addEventListener("click", e=>{
  const b = e.target.closest(".td"); if (!b) return;
  e.stopPropagation();
  if (b.dataset.tmore) openTodos(); else toggleTodo(b.dataset.tid);
}, true);
let tdEditing = null;
function openTodoEditor(id){
  const t = todos.find(x=>x.id===id); if (!t) return;
  tdEditing = t;
  $("teTitle").value = t.title; $("teDate").value = t.date; catOptions($("teCat"), t.cat); $("teNote").value = t.note;
  $("tdOverlay").classList.add("show");
}
const closeTodoEditor = () => { $("tdOverlay").classList.remove("show"); tdEditing = null; };
$("teCancel").onclick = closeTodoEditor;
$("tdOverlay").addEventListener("pointerdown", e=>{ if (e.target === $("tdOverlay")) closeTodoEditor(); });
$("tdForm").addEventListener("submit", e=>{
  e.preventDefault(); if (!tdEditing) return;
  const title = $("teTitle").value.trim(); if (!title) { toast("内容不能为空"); return; }
  Object.assign(tdEditing, {title, date:$("teDate").value, cat:$("teCat").value, note:$("teNote").value.trim()});
  closeTodoEditor(); todosChanged();
});
$("teDelete").onclick = ()=>{ if (!tdEditing) return; const id = tdEditing.id; todos = todos.filter(t=>t.id!==id); closeTodoEditor(); todosChanged(); toast("已删除"); };
$("teSchedule").onclick = ()=>{
  if (!tdEditing) return;
  const t = {...tdEditing, title:$("teTitle").value.trim()||tdEditing.title, cat:$("teCat").value, date:$("teDate").value, note:$("teNote").value.trim()};
  closeTodoEditor(); closeTodos();
  const ln = logicalNow();
  const day = t.date ? new Date(...t.date.split("-").map((v,i)=>i===1?+v-1:+v)) : ln.day;
  const isToday = ymd(day) === ymd(ln.day);
  const place = () => {
    const d = dayDiff(day, weekStart);
    const s = isToday ? Math.max(settings.start*60, Math.ceil(ln.m/30)*30) : Math.max(settings.start*60, 600);
    const ev = addEvent({d, s, len:60, title:t.title, cat:t.cat, plan:true, note:t.note});
    todos = todos.filter(x=>x.id!==t.id); todosChanged();
    toast("已放到时间轴上，拖动或点开调整时间");
    openEditor(ev, false);
  };
  const wk = satOf(day);
  if (wk.getTime() === weekStart.getTime()) place();
  else { afterLoad = place; gotoWeek(wk); }
};

// ---------- time summary (week / month) ----------
// Counts solid blocks only: direct records + completed plans. A block counts on the day column it sits in.
let statMode = "week", statAnchor = null, statSeq = 0;
const STAT_CATS = [...CAT_ORDER, "none"];
async function weekEventsFor(sat){
  if (sat.getTime() === weekStart.getTime()) return events;
  return (await readWeek(weekKey(sat))) || null;
}
function statRange(){
  if (statMode === "week") { const s = satOf(statAnchor); return {start:s, end:addDays(s,6)}; }
  const s = new Date(statAnchor.getFullYear(), statAnchor.getMonth(), 1);
  return {start:s, end:new Date(s.getFullYear(), s.getMonth()+1, 0)};
}
async function renderStats(){
  const seq = ++statSeq, {start, end} = statRange();
  const md = d => `${d.getMonth()+1}/${d.getDate()}`;
  $("statLabel").textContent = statMode === "week" ? `${md(start)} – ${md(end)}` : `${start.getFullYear()} 年 ${start.getMonth()+1} 月`;
  document.querySelectorAll("#statOverlay [data-sm]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.sm===statMode));
  // buckets: days for a week, Sat-start weeks (clipped to the month) for a month
  const buckets = [];
  if (statMode === "week") for (let i=0;i<7;i++){ const d = addDays(start,i); buckets.push({from:d, to:d, label:DOW[d.getDay()].slice(1), sub:md(d)}); }
  else for (let w = satOf(start); w <= end; w = addDays(w,7)) { const f = w < start ? start : w, t = addDays(w,6) > end ? end : addDays(w,6); buckets.push({from:f, to:t, label:md(f), sub:"–"+md(t)}); }
  buckets.forEach(b => b.mins = {});
  const total = {}, byTitle = {};
  let missing = 0;
  for (let w = satOf(start); w <= end; w = addDays(w,7)) {
    const list = await weekEventsFor(w);
    if (seq !== statSeq) return;
    if (list === null) { missing++; continue; }
    for (const e of list) {
      if (!counts(e)) continue;
      const day = addDays(w, e.d); if (day < start || day > end) continue;
      const c = CATS[e.cat] ? e.cat : "none";
      total[c] = (total[c]||0) + e.len;
      const b = buckets.find(b => day >= b.from && day <= b.to); if (b) b.mins[c] = (b.mins[c]||0) + e.len;
      const key = c + "|" + ((e.title||"").trim() || catName(e.cat));
      byTitle[key] = (byTitle[key]||0) + e.len;
    }
  }
  const sum = STAT_CATS.reduce((a,c)=>a+(total[c]||0),0);
  const nm = c => c === "none" ? "未定" : CATS[c];
  if (!sum) { $("statBody").innerHTML = `<p class="hint">${missing ? "读不到这段时间的数据，检查网络后再试。" : "这段时间还没有实线记录。提前安排要打勾完成后才会算进来。"}</p>`; return; }
  const maxCat = Math.max(...STAT_CATS.map(c=>total[c]||0));
  const shown = STAT_CATS.filter(c => total[c]);
  let h = `<div class="hero"><b>${hours(sum)}</b><span>小时 · 只算实线（直接记录 + 已完成的提前安排）${missing?` · 有 ${missing} 周没读到`:""}</span></div>`;
  h += `<div class="catbars">${shown.map(c=>`<div class="cb ${kcls(c)}"><span class="nm"><i></i>${nm(c)}</span><span class="track"><i style="width:${(total[c]/maxCat*100).toFixed(1)}%"></i></span><span class="v">${hours(total[c])}h <small>${Math.round(total[c]/sum*100)}%</small></span></div>`).join("")}</div>`;
  // stacked columns
  const maxB = Math.max(60, ...buckets.map(b => STAT_CATS.reduce((a,c)=>a+(b.mins[c]||0),0)));
  const stepH = [1,2,4,5,10,20,25,50].find(s => maxB/60/s <= 4) || 100;
  const topH = Math.ceil(maxB/60/stepH)*stepH;
  let grid = "";
  for (let v = stepH; v <= topH; v += stepH) grid += `<div class="gl" style="bottom:${v/topH*100}%"><span>${v}h</span></div>`;
  h += `<h3>${statMode==="week"?"每天":"每周"}</h3><div class="legend">${shown.map(c=>`<span class="${kcls(c)}"><i></i>${nm(c)}</span>`).join("")}</div>`;
  h += `<div class="cols">${grid}${buckets.map((b,i)=>{
      const tot = STAT_CATS.reduce((a,c)=>a+(b.mins[c]||0),0);
      return `<div class="col" data-b="${i}" tabindex="0" aria-label="${b.label}${b.sub} 共 ${hours(tot)} 小时">${STAT_CATS.filter(c=>b.mins[c]).map(c=>`<i class="${kcls(c)}" style="height:calc(${(b.mins[c]/60/topH*100).toFixed(2)}% - 2px)"></i>`).join("")}</div>`;
    }).join("")}</div>`;
  h += `<div class="colx">${buckets.map(b=>{ const tot = STAT_CATS.reduce((a,c)=>a+(b.mins[c]||0),0); return `<span><b>${tot?hours(tot):"–"}</b>${b.label}${statMode==="month"?"<br>"+b.sub:""}</span>`; }).join("")}</div>`;
  // breakdown by item within each category (also the table view of the chart)
  h += `<h3>按项目</h3><table class="brk"><tbody>`;
  for (const c of shown) {
    const items = Object.entries(byTitle).filter(([k])=>k.startsWith(c+"|")).map(([k,v])=>[k.slice(c.length+1), v]).sort((a,b)=>b[1]-a[1]);
    const top = items.slice(0,8), rest = items.slice(8).reduce((a,[,v])=>a+v,0);
    h += `<tr><th class="${kcls(c)}"><span class="ct"><i></i>${nm(c)}</span></th><th class="n" style="text-align:right">${hours(total[c])}h</th></tr>`;
    h += top.map(([t,v])=>`<tr><td>${esc(t)}</td><td class="n">${hours(v)}h</td></tr>`).join("");
    if (rest) h += `<tr><td>其他 ${items.length-8} 项</td><td class="n">${hours(rest)}h</td></tr>`;
  }
  h += `</tbody></table>`;
  $("statBody").innerHTML = h;
  // hover tooltip per column
  const tip = $("tip");
  $("statBody").querySelectorAll(".col").forEach(col => {
    const b = buckets[+col.dataset.b];
    const show = ev => {
      const tot = STAT_CATS.reduce((a,c)=>a+(b.mins[c]||0),0);
      tip.innerHTML = `<b>${b.label}${statMode==="month"?" "+b.sub:" "+b.sub}</b> · ${hours(tot)}h<br>` + STAT_CATS.filter(c=>b.mins[c]).map(c=>`${nm(c)} ${hours(b.mins[c])}h`).join("<br>");
      tip.hidden = false;
      const r = col.getBoundingClientRect(), x = ev && ev.clientX ? ev.clientX : r.left + r.width/2;
      tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, x + 12)) + "px";
      tip.style.top = Math.max(8, r.top + 8) + "px";
    };
    col.addEventListener("pointermove", show); col.addEventListener("focus", ()=>show());
    col.addEventListener("pointerleave", ()=> tip.hidden = true); col.addEventListener("blur", ()=> tip.hidden = true);
  });
}
function openStats(){ statAnchor = statMode === "week" ? weekStart : addDays(weekStart, 3); $("statOverlay").classList.add("show"); renderStats(); }
const closeStats = () => { $("statOverlay").classList.remove("show"); $("tip").hidden = true; };
$("statBtn").onclick = openStats;
$("statClose").onclick = closeStats;
$("statOverlay").addEventListener("pointerdown", e=>{ if (e.target === $("statOverlay")) closeStats(); });
document.querySelectorAll("#statOverlay [data-sm]").forEach(b => b.onclick = () => { statMode = b.dataset.sm; renderStats(); });
$("statPrev").onclick = ()=>{ statAnchor = statMode === "week" ? addDays(statAnchor,-7) : new Date(statAnchor.getFullYear(), statAnchor.getMonth()-1, 1); renderStats(); };
$("statNext").onclick = ()=>{ statAnchor = statMode === "week" ? addDays(statAnchor,7) : new Date(statAnchor.getFullYear(), statAnchor.getMonth()+1, 1); renderStats(); };

// ---------- boot ----------
if (/Android/i.test(navigator.userAgent) && matchMedia("(display-mode: standalone)").matches) document.documentElement.classList.add("app-android");
const z = lsGet("zoom"); if (ZOOMS.includes(z)) hh = z; else if (innerWidth < 520) hh = 44;
const zw = lsGet("colw"); cw = WIDTHS.includes(zw) ? zw : (innerWidth < 520 ? 100 : 64); applyWidth();
const md = lsGet("mode"); if (md === "plan" || md === "record") mode = md;
weekStart = satOf(logicalNow().day);
renderAll();
requestAnimationFrame(scrollToNow);
initStore();
setInterval(pomoTick, 1000);
setInterval(()=>{ if (!drag && !document.querySelector(".overlay.show")) renderBoard(); }, 30000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) { pomoTick(); if (!drag) renderBoard(); } });
pomoTick();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
